services:
  mongodb:
    image: mongo:8.0-noble
    container_name: mongodb
    ports:
      - "27007:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - backend
    restart: always

volumes:
  mongo_data:

networks:  
  backend: